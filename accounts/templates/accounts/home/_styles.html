<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --panel-soft: #eef3f9;
    --line: #d7e0ea;
    --text: #1f2937;
    --muted: #64748b;
    --primary: #921F22;
    --primary-dark: #7a1a1c;
    --danger: #b91c1c;
    --shadow: 0 4px 16px rgba(146,31,34,0.06), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 8px 28px rgba(146,31,34,0.12), 0 2px 8px rgba(0,0,0,0.05);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Plus Jakarta Sans", sans-serif;
    background: linear-gradient(180deg, #faf8f7 0%, #f5f0ef 100%);
    color: var(--text);
  }

  .layout {
    min-height: 100vh;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 300px 1fr;
  }

  @media (max-width: 1200px) {
    .layout {
      grid-template-columns: 260px 1fr;
    }
  }

  @media (max-width: 900px) {
    .layout {
      grid-template-columns: 1fr;
    }
  }

  .sidebar {
    display: flex;
    width: 100%;
    min-height: 100vh;
    padding: 16px;
    flex-direction: column;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    border-right: 1px solid #E7E5E4;
    background: #FFF;
    box-sizing: border-box;
  }

  /* sidebar inline styles at 900px removed — drawer CSS below handles it */

  .sidebar-main {
    display: grid;
    gap: 28px;
  }

  .brand {
    margin-bottom: 32px;
  }

  .brand h1 {
    margin: 0 0 8px;
    font-size: 30px;
    line-height: 28px;
    letter-spacing: -1px;
  }

  .brand-name {
    color: #000;
    font-family: Lexend, sans-serif;
    font-size: 30px;
    font-style: normal;
    font-weight: 400;
    line-height: 28px;
    letter-spacing: -1px;
  }

  .brand-school {
    color: #921F22;
    font-family: "BackBone Melavita";
    font-size: 30px;
    font-style: italic;
    font-weight: 400;
    line-height: 28px;
    letter-spacing: -1px;
  }

  .brand-portal {
    display: flex;
    width: 136.98px;
    height: 20px;
    flex-direction: column;
    justify-content: center;
    margin: 0;
    color: #78716C;
    font-family: Lexend, sans-serif;
    font-size: 10px;
    font-style: normal;
    font-weight: 400;
    line-height: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  @media (max-width: 900px) {
    .brand h1 {
      font-size: 24px;
      line-height: 24px;
    }

    .brand-name,
    .brand-school {
      font-size: 24px;
      line-height: 24px;
    }

    .brand-portal {
      font-size: 9px;
      width: auto;
    }
  }

  .nav {
    align-self: stretch;
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 100%;
  }

  .nav button {
    align-self: stretch;
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 11px 16px;
    border: 0;
    border-left: 3px solid transparent;
    border-radius: 8px;
    background: transparent !important;
    color: #57534e !important;
    text-align: left;
    font-family: Lexend, sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .nav button.active {
    background: #FEF2F2 !important;
    color: #921f22 !important;
    border-left-color: #921F22 !important;
    font-weight: 600;
  }

  .nav button.active svg path {
    fill: #921f22 !important;
  }

  .nav button:not(.active) svg path {
    fill: #78716c !important;
  }

  .nav button:not(.active):hover {
    background: #FEF8F5 !important;
    color: #44403C !important;
  }

  .nav button:not(.active):hover svg path {
    fill: #44403C !important;
  }

  .tab-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 22px;
    height: 18px;
  }

  .tab-icon svg {
    width: 100%;
    height: 100%;
    max-width: 22px;
    max-height: 18px;
  }

  /* Responsive navigation buttons */
  @media (max-width: 1200px) {
    .nav button {
      padding: 10px 14px;
      font-size: 15px;
      gap: 10px;
    }

    .tab-icon {
      width: 20px;
      height: 16px;
    }

    .tab-icon svg {
      max-width: 20px;
      max-height: 16px;
    }
  }

  @media (max-width: 900px) {
    .nav {
      gap: 2px;
    }

    .nav button {
      padding: 10px 12px;
      font-size: 14px;
      gap: 10px;
      border-radius: 6px;
    }

    .tab-icon {
      width: 18px;
      height: 16px;
    }

    .tab-icon svg {
      max-width: 18px;
      max-height: 16px;
    }

    .sidebar-footer {
      width: auto !important;
      display: flex;
      justify-content: flex-start;
    }

    .logout-form {
      width: auto !important;
    }

    .sidebar-footer .logout-form button {
      width: auto !important;
      padding: 10px 16px;
      font-size: 14px;
      gap: 10px;
    }
  }

  @media (max-width: 600px) {
    .nav button {
      padding: 8px 10px;
      font-size: 13px;
      gap: 8px;
    }

    .tab-icon {
      width: 16px;
      height: 14px;
    }

    .tab-icon svg {
      max-width: 16px;
      max-height: 14px;
    }

    .sidebar-footer .logout-form button {
      padding: 10px 12px;
      font-size: 14px;
      gap: 10px;
    }
  }

  .content {
    width: 100%;
    max-width: 100%;
    padding: 28px;
  }

  .shell {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
  }

  /* .shell {
    background: rgba(255, 255, 255, 0.74);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 28px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    padding: 28px;
  } */

  .htmx-indicator {
    position: fixed;
    top: 18px;
    right: 18px;
    width: 44px;
    height: 44px;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(15, 23, 42, 0.12);
    border-radius: 999px;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    z-index: 9999;
  }

  .htmx-indicator.htmx-request {
    display: flex;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 999px;
    border: 2px solid rgba(146, 31, 34, 0.20);
    border-top-color: rgba(146, 31, 34, 0.90);
    animation: spin 700ms linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
  }

  .topbar h2 {
    margin: 0;
    font-size: 34px;
  }

  .topbar p {
    margin: 6px 0 0;
    color: var(--muted);
  }

  .logout-form {
    margin: 0;
    width: 100%;
  }

  .sidebar-footer {
    width: 100%;
    padding-top: 8px;
    border-top: 1px solid #E7E5E4;
  }

  .sidebar-footer .logout-form button {
    width: 100%;
    align-self: stretch;
    display: flex;
    padding: 11px 16px;
    align-items: center;
    gap: 12px;
    border-radius: 8px;
    border-left: 3px solid transparent;
    background: transparent;
    color: #921F22;
    border: 0;
    font-family: Lexend, sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: 20px;
    text-align: left;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .sidebar-footer .logout-form button:hover {
    background: rgba(113, 2, 14, 0.06);
  }

  .sidebar-footer .logout-form button svg path {
    fill: #921F22;
  }

  .button,
  .logout-form button,
  .table-actions button {
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-family: Lexend, sans-serif;
    font-weight: 600;
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  .button-primary,
  .table-actions .button-accent {
    background: #921F22;
    color: #fff;
  }

  .button-primary:hover {
    background: #7a1a1c;
  }

  .button-secondary {
    background: var(--panel-soft);
    color: var(--text);
    border: 1px solid var(--line);
  }

  /* Form action buttons */
  .form-actions .button-primary {
    display: inline-flex;
    padding: 10px 28px;
    align-items: center;
    gap: 8px;
    border-radius: 8px;
    background: #921F22;
    color: #FFF;
    font-family: Lexend, sans-serif;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .form-actions .button-primary:hover {
    background: #7a1a1c;
  }

  .form-actions .button-secondary {
    display: inline-flex;
    padding: 10px 20px;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    border: 1.5px solid #921F22;
    background: transparent;
    color: #921F22;
    font-family: Lexend, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .form-actions .button-secondary:hover {
    background: rgba(146, 31, 34, 0.05);
  }

  /* Panel action buttons */
  .panel-actions .button.button-primary {
    display: inline-flex;
    padding: 9px 20px;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    background: #921F22;
    color: #FFF;
    font-family: Lexend, sans-serif;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .panel-actions .button.button-primary:hover {
    background: #7a1a1c;
  }

  .panel-actions .button.button-secondary {
    display: inline-flex;
    padding: 9px 20px;
    justify-content: center;
    align-items: center;
    border-radius: 8px;
    border: 1.5px solid #921F22;
    background: transparent;
    color: #921F22;
    font-family: Lexend, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    white-space: nowrap;
    transition: background 0.15s ease;
  }

  .panel-actions .button.button-secondary:hover {
    background: rgba(146, 31, 34, 0.05);
  }

  /* Responsive adjustments for panel action buttons */
  @media (max-width: 768px) {
    .panel-actions .button-primary,
    .panel-actions .button-secondary {
      padding: 8px 16px;
      font-size: 13px;
    }
  }

  @media (max-width: 480px) {
    .panel-actions .button-primary,
    .panel-actions .button-secondary {
      padding: 6px 12px;
      font-size: 12px;
    }
  }

  .button-danger {
    background: #fee2e2;
    color: var(--danger);
  }

  .button-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
  }

  .tab-panel {
    display: none;
  }

  .tab-panel.active {
    display: block;
    animation: fadeIn 0.24s ease;
    background: transparent;
  }

  .hero-card {
    margin-bottom: 20px;
  }

  .panel-card {
    background: #fff;
    border: 1px solid #EDE9E3;
    border-radius: 16px;
    margin-bottom: 20px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(146,31,34,0.04), 0 2px 8px rgba(0,0,0,0.03);
  }

  .welcome-banner {
    display: flex;
    width: 100%;
    min-height: 150px;
    padding: 36px;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    border-radius: 18px;
    background-color: #921F22;
    background-image: linear-gradient(105deg, rgba(90,18,21,0.97) 0%, rgba(146,31,34,0.88) 50%, rgba(146,31,34,0.72) 100%), url('/static/accounts/user_welcome_bg_img.png');
    background-position: center center;
    background-repeat: no-repeat;
    background-size: cover;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(146,31,34,0.25), 0 2px 8px rgba(0,0,0,0.08);
    position: relative; overflow: hidden;
  }
  .welcome-banner::before {
    content: ''; position: absolute; top: -60px; right: -60px;
    width: 240px; height: 240px;
    background: rgba(255,255,255,0.04); border-radius: 50%;
    pointer-events: none;
  }

  .welcome-banner h3 {
    margin: 0 0 6px;
    color: #FFF;
    font-family: Lexend, sans-serif;
    font-size: 28px;
    font-style: normal;
    font-weight: 700;
    line-height: 36px;
    letter-spacing: -0.02em;
  }

  .welcome-banner p {
    margin: 0;
    color: rgba(255,255,255,0.88);
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 15px;
    font-style: normal;
    font-weight: 400;
    line-height: 24px;
  }

  .banner-action-button {
    display: inline-flex;
    padding: 10px 20px;
    justify-content: center;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    background: transparent;
    color: #FFF;
    border: 1.5px solid rgba(255,255,255,0.70);
    text-align: center;
    font-family: Lexend, sans-serif;
    font-size: 13px;
    font-style: normal;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .banner-action-button:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.90);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    width: 100%;
  }

  @media (max-width: 1024px) {
    .stats {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 640px) {
    .stats {
      grid-template-columns: 1fr;
    }
  }

  .stat {
    width: 100%;
    position: relative;
    border: 1px solid #EDE9E3;
    border-top: 4px solid #921F22;
    background: #FFFFFF;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(146, 31, 34, 0.06), 0 1px 3px rgba(0,0,0,0.04);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-sizing: border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .stat:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(146, 31, 34, 0.10), 0 2px 6px rgba(0,0,0,0.05);
  }

  .stat span {
    display: block;
    align-self: stretch;
    color: #78716C;
    font-family: Lexend, sans-serif;
    font-size: 11px;
    font-style: normal;
    font-weight: 600;
    line-height: 16px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .stat strong {
    display: block;
    align-self: stretch;
    color: #0F172A;
    font-family: Lexend, sans-serif;
    font-size: 32px;
    font-style: normal;
    font-weight: 800;
    line-height: 40px;
    letter-spacing: -0.02em;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    border-bottom: 1px solid #F5F4F2;
  }

  .panel-header h3 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    color: #1C1917;
    font-family: Lexend, sans-serif;
    font-size: 15px;
    font-weight: 700;
    line-height: 24px;
  }

  .panel-header p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .count-chip {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    background: #F5F4F2;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    color: #78716C;
    font-family: Lexend, sans-serif;
    letter-spacing: 0.02em;
  }

  .panel-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: transparent;
  }

  thead {
    background: #FAFAF9;
    border-bottom: 1px solid #F0EEEB;
  }

  th {
    padding: 11px 20px;
    text-align: left;
    vertical-align: middle;
    color: #A8A29E;
    font-family: Lexend, sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  td {
    padding: 15px 20px;
    border-bottom: 1px solid #F5F4F2;
    vertical-align: middle;
    text-align: left;
    color: #44403C;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.4;
  }

  tbody tr {
    transition: background 0.12s ease;
    position: relative;
  }

  tbody tr:hover {
    background: #FEF8F5;
  }

  tbody tr:last-child td {
    border-bottom: none;
  }

  .table-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Avatar + name cell */
  .user-cell {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    font-family: Lexend, sans-serif;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }

  .user-avatar.student   { background: #FFF4E8; color: #C05C00; }
  .user-avatar.faculty   { background: #EFF6FF; color: #1D4ED8; }
  .user-avatar.supervisor{ background: #F0FDF4; color: #15803D; }
  .user-avatar.admin     { background: #F5F3FF; color: #6D28D9; }
  .user-avatar.default   { background: #F5F4F2; color: #78716C; }

  .user-cell-info .user-name {
    font-family: Lexend, sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: #1C1917;
    line-height: 1.3;
  }

  .user-cell-info .user-meta {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 12px;
    color: #A8A29E;
    margin-top: 1px;
  }

  /* Role + status pills — compact */
  .role-pill,
  .status-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: Lexend, sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .role-pill.student,
  .status-pill.student   { color: #C05C00; background: #FFF4E8; }

  .role-pill.faculty     { color: #1D4ED8; background: #EFF6FF; }
  .role-pill.supervisor  { color: #15803D; background: #F0FDF4; }
  .role-pill.admin       { color: #6D28D9; background: #F5F3FF; }

  .status-pill.active    { color: #15803D; background: #F0FDF4; }
  .status-pill.inactive  { color: #B91C1C; background: #FEF2F2; }

  /* Small table action buttons */
  .btn-table-danger {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: #FEF2F2;
    color: #991B1B;
    border: 1px solid #FECACA;
    border-radius: 6px;
    font-family: Lexend, sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-table-danger:hover { background: #FEE2E2; border-color: #FCA5A5; }

  .btn-table-ghost {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 12px;
    background: transparent;
    color: #57534E;
    border: 1px solid #E7E5E4;
    border-radius: 6px;
    font-family: Lexend, sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-table-ghost:hover { background: #F5F5F4; border-color: #D6D3D1; }

  .table-action-cell {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* Empty table state */
  .table-empty-row td {
    padding: 40px 20px;
    text-align: center;
    color: #A8A29E;
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 14px;
  }

  /* Password reveal cell */
  .password-reveal {
    font-family: "Plus Jakarta Sans", sans-serif;
    font-size: 13px;
